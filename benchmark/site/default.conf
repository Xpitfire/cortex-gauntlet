# nginx static server for the public Gauntlet results site.
# HTML is revalidated on every load (no-cache) so a freshly deployed report shows immediately
# instead of being served stale from the browser's heuristic cache; immutable media/assets stay
# cacheable. ETag + must-revalidate means "no-cache" still allows a cheap 304 when unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reports / landing / docs: always revalidate so updates are seen without a hard refresh.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Screenshots and other static media: cacheable for a day (filenames are stable per run).
    location ~* \.(png|jpe?g|gif|svg|webp|ico|css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }
}
